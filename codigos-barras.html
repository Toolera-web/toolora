
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de códigos de barras | Toolora</title>
<meta name="description" content="Genera códigos de barras CODE128 y EAN-13 gratis y descárgalos como imagen PNG.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#929292;color:#111}
header{background:#171717;padding:18px 7%;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;color:white;font-size:23px;font-weight:bold;text-decoration:none}
.logo-icon{background:#D6FF36;color:#111;width:35px;height:35px;border-radius:9px;display:grid;place-items:center}
.back{color:white;text-decoration:none;font-size:14px}
main{max-width:720px;margin:55px auto;padding:0 18px}
.card{background:white;border-radius:18px;padding:35px;box-shadow:0 8px 25px #00000012}
h1{font-size:30px;margin:0 0 10px}
.description{color:#666;line-height:1.5;margin-bottom:28px}
.field{margin-bottom:20px}
.field label{display:block;font-size:14px;font-weight:bold;margin-bottom:9px}
.field input,.field select{width:100%;padding:14px;border:2px solid #e5e5e5;border-radius:9px;font-size:16px;background:white}
.field input:focus,.field select:focus{outline:2px solid #D6FF36;border-color:#b0d600}
.hint{font-size:12px;color:#777;margin-top:7px;line-height:1.5}
.generate{width:100%;padding:15px;background:#D6FF36;color:#111;font-size:16px;border:0;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:5px}
.result{display:none;margin-top:28px}
.preview{background:#f5f5f5;border-radius:12px;padding:25px 12px;text-align:center;overflow:hidden}
.preview svg{max-width:100%;height:auto}
.actions{display:flex;gap:10px;margin-top:15px}
.actions button{flex:1;padding:14px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}
.download{background:#D6FF36}
.new{background:#eee}
.error{color:#b00020;font-size:14px;margin-top:12px}
footer{text-align:center;color:#333;font-size:13px;padding:25px}
@media(max-width:520px){.card{padding:24px 19px}h1{font-size:25px}main{margin:30px auto}.actions{flex-direction:column}}
</style>
</head>
<body>
<header>
<a class="logo" href="/"><span class="logo-icon">T</span> Toolora</a>
<a class="back" href="/">← Volver a herramientas</a>
</header>

<main>
<div class="card">
<h1>Generador de códigos de barras</h1>
<p class="description">Escribe un código, elige el formato y genera tu código de barras en segundos.</p>

<div class="field">
<label for="format">Formato del código</label>
<select id="format">
<option value="CODE128">CODE128 (letras y números)</option>
<option value="EAN13">EAN-13 (13 dígitos)</option>
</select>
</div>

<div class="field">
<label for="code">Tu código</label>
<input id="code" type="text" placeholder="Ejemplo: TOOLORA123">
<p class="hint" id="hint">CODE128 permite letras, números y muchos símbolos.</p>
</div>

<button class="generate" id="generate" type="button">Generar código de barras</button>
<p class="error" id="error" aria-live="polite"></p>

<section class="result" id="result">
<div class="preview">
<svg id="barcode"></svg>
</div>
<div class="actions">
<button class="download" id="download" type="button">Descargar PNG</button>
<button class="new" id="clear" type="button">Crear otro</button>
</div>
</section>
</div>
</main>

<footer>Toolora · Herramientas gratuitas y fáciles de usar</footer>

<script>
const $ = id => document.getElementById(id);
let currentSvg = null;

$("format").addEventListener("change", () => {
  $("hint").textContent = $("format").value === "EAN13"
    ? "Introduce 13 dígitos. El último debe ser el dígito de control correcto."
    : "CODE128 permite letras, números y muchos símbolos.";
  $("code").placeholder = $("format").value === "EAN13"
    ? "Ejemplo: 5901234123457"
    : "Ejemplo: TOOLORA123";
  $("error").textContent = "";
});

function validEan13(value) {
  if (!/^\d{13}$/.test(value)) return false;
  const digits = value.split("").map(Number);
  const sum = digits.slice(0,12).reduce((total, digit, index) =>
    total + digit * (index % 2 === 0 ? 1 : 3), 0);
  const checkDigit = (10 - (sum % 10)) % 10;
  return checkDigit === digits[12];
}

$("generate").addEventListener("click", () => {
  const value = $("code").value.trim();
  const format = $("format").value;
  $("error").textContent = "";
  $("result").style.display = "none";

  if (!value) {
    $("error").textContent = "Escribe un código antes de continuar.";
    return;
  }

  if (format === "EAN13" && !validEan13(value)) {
    $("error").textContent = "El EAN-13 debe tener 13 dígitos y un dígito de control válido.";
    return;
  }

  if (!window.JsBarcode) {
    $("error").textContent = "No se ha podido cargar el generador. Comprueba tu conexión e inténtalo de nuevo.";
    return;
  }

  try {
    const svg = $("barcode");
    svg.innerHTML = "";

    JsBarcode(svg, value, {
      format: format,
      lineColor: "#111111",
      background: "#ffffff",
      width: 2,
      height: 100,
      margin: 10,
      displayValue: true,
      fontSize: 17,
      textMargin: 8
    });

    currentSvg = svg;
    $("result").style.display = "block";
  } catch (error) {
    $("error").textContent = "No se ha podido generar el código. Comprueba el formato y el contenido.";
  }
});

$("download").addEventListener("click", () => {
  if (!currentSvg) return;

  const svgText = new XMLSerializer().serializeToString(currentSvg);
  const blob = new Blob([svgText], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const img = new Image();

  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = img.width * 2;
    canvas.height = img.height * 2;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    canvas.toBlob(png => {
      const link = document.createElement("a");
      const pngUrl = URL.createObjectURL(png);
      link.href = pngUrl;
      link.download = "codigo-de-barras.png";
      link.click();
      URL.revokeObjectURL(pngUrl);
      URL.revokeObjectURL(url);
    }, "image/png");
  };

  img.onerror = () => {
    URL.revokeObjectURL(url);
    $("error").textContent = "No se ha podido descargar la imagen.";
  };

  img.src = url;
});

$("clear").addEventListener("click", () => {
  $("code").value = "";
  $("result").style.display = "none";
  $("error").textContent = "";
  currentSvg = null;
});
</script>
</body>
</html>
